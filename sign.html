<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN</title>
    <style>
      .container {
        /* display: flex;
    justify-content: center;
    align-items: center; */
        background-color: black;
        padding: 10px;
        display: inline-block;
        justify-content: center;
        align-content: center;
      }
      .card input {
        border-radius: 10px;
        padding: 15px;
        background-color: black;
        margin: 5px;
        width: 400px;
      }
      button {
        border-radius: 50px;
        padding: 15px;
        margin: 5px;
        width: 440px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1 style="color: white; font-family: Arial, Helvetica, sans-serif">
          Create your account
        </h1>
        <form>
          <!-- <label for="Fullname">Full name</label> -->
          <input
            id="Fullname"
            type="text"
            placeholder="Full name"
            required
          /><br />
          <!-- <label for="Email">Email</label><br> -->
          <input id="Email" type="email" placeholder="Email" required /><br />
          <!-- <label for="Phonenumber">Phone number</label> -->
           
          <input
            id="Phonenumber"
            type="tel"
            maxlength="10"
            placeholder="256 7xxxxxxxx"
            required
          /><br />
          <div>
            <img src="flag1.jpg" alt="uganda flag" width="30px"/>
          </div>
          <!-- <label for="Password">Password</label> -->
          <input
            id="Password"
            type="password"
            placeholder="Password"
            required
          /><br />
          <!-- <label for="ConfirmPassword">Confirm Password</label> -->
          <input
            id="ConfirmPassword"
            type="password"
            placeholder="Confirm Password"
            required
          /><br />
          <button type="submit"><b>Sign up</b></button>
          <h5
            style="
              color: white;
              font-family: Arial, Helvetica, sans-serif;
              text-align: center;
            "
          >
            By signing up, you agree to the <b>Terms of service</b> and
            <b>Privacy policy</b>
          </h5>
          <h4
            style="
              color: white;
              font-family: Arial, Helvetica, sans-serif;
              text-align: center;
            "
          >
            Already have an account? <span>Sign in</span>
          </h4>
        </form>
      </div>
    </div>
  </body>
</html>
